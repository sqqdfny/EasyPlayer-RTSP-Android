apply plugin: 'com.android.application'

android {
    namespace 'org.easydarwin.player.simpleplayer'
    compileSdk 36

    defaultConfig {
        applicationId "org.easydarwin.easyplayer"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"

        buildConfigField 'String', 'KEY', '"EasyPlayer is free!"'
        buildConfigField 'String', 'RTSP_URL', '"rtsp://184.72.239.149/vod/mp4://BigBuckBunny_175k.mov"'

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding 'UTF-8'
    }

}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation project(':library')
}
